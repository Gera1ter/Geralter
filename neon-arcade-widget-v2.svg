<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Geralter Neon Arcade</title>
  <desc id="desc">Animated neon arcade preview showing an autonomous dodge game.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060610"/>
      <stop offset=".55" stop-color="#0b0b18"/>
      <stop offset="1" stop-color="#140816"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity=".09"/>
    </pattern>

    <clipPath id="screenClip">
      <rect x="250" y="78" width="420" height="220" rx="12"/>
    </clipPath>
  </defs>

  <rect width="920" height="360" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="918" height="358" rx="19" fill="none" stroke="#22d3ee" stroke-opacity=".35"/>

  <text x="42" y="58" fill="#e5e7eb" font-family="monospace" font-size="23" font-weight="700" letter-spacing="4">NEON-ARCADE</text>
  <text x="44" y="82" fill="#67e8f9" font-family="monospace" font-size="11" letter-spacing="2">GERALTER // AUTO PLAY MODE</text>

  <rect x="250" y="78" width="420" height="220" rx="12" fill="#05050d" stroke="#22d3ee" stroke-opacity=".45"/>
  <rect x="250" y="78" width="420" height="220" rx="12" fill="url(#grid)"/>

  <g clip-path="url(#screenClip)">
    <!-- Obstacles: each object moves as one unit, avoiding x/y desynchronisation -->
    <g filter="url(#glowPink)">
      <g>
        <rect x="292" y="-34" width="22" height="22" rx="2" fill="#a855f7"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 165 365; 80 365; 0 0"
          dur="4.8s" repeatCount="indefinite"/>
      </g>

      <g>
        <rect x="500" y="-64" width="27" height="27" rx="2" fill="#ec4899"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -95 362; 75 362; 0 0"
          dur="5.4s" begin="-1.1s" repeatCount="indefinite"/>
      </g>

      <g>
        <rect x="610" y="-28" width="19" height="19" rx="2" fill="#a855f7"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -230 360; -55 360; 0 0"
          dur="4.4s" begin="-1.8s" repeatCount="indefinite"/>
      </g>

      <g>
        <rect x="395" y="-48" width="24" height="24" rx="2" fill="#ec4899"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 185 360; 45 360; 0 0"
          dur="5.9s" begin="-2.7s" repeatCount="indefinite"/>
      </g>

      <g>
        <rect x="555" y="-80" width="16" height="16" rx="2" fill="#a855f7"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -170 360; -20 360; 0 0"
          dur="4.2s" begin="-3.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Player -->
    <g filter="url(#glowCyan)">
      <polygon points="460,258 447,286 473,286" fill="url(#cyan)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -82 0; 72 0; -42 0; 0 0"
          dur="6s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Scanline -->
    <rect x="250" y="78" width="420" height="2" fill="#67e8f9" opacity=".14">
      <animate attributeName="y" values="78;296;78" dur="3.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="270" y="101" fill="#67e8f9" font-family="monospace" font-size="10" letter-spacing="2">AUTO</text>
  <text x="585" y="101" fill="#9ca3af" font-family="monospace" font-size="10">ONLINE</text>

  <g font-family="monospace">
    <text x="705" y="122" fill="#9ca3af" font-size="11" letter-spacing="2">STATUS</text>
    <text x="705" y="151" fill="#67e8f9" font-size="19" font-weight="700">RUNNING</text>

    <text x="705" y="190" fill="#9ca3af" font-size="11" letter-spacing="2">SCORE</text>

    <!-- Discrete animated score: much more reliable than trying to mutate text content -->
    <g fill="#e5e7eb" font-size="25" font-weight="700">
      <text x="705" y="218" opacity="1">0000</text>
      <text x="705" y="218" opacity="0">0012</text>
      <text x="705" y="218" opacity="0">0027</text>
      <text x="705" y="218" opacity="0">0041</text>
      <text x="705" y="218" opacity="0">0058</text>
      <text x="705" y="218" opacity="0">0074</text>
      <animate attributeName="opacity" values="1;0;0;0;0;0;1"
        dur="7.2s" repeatCount="indefinite"/>
    </g>

    <!-- Separate opacity animation for each score value -->
    <g fill="#e5e7eb" font-size="25" font-weight="700">
      <text x="705" y="218">0000
        <animate attributeName="opacity" values="1;0" dur="7.2s" repeatCount="indefinite"/>
      </text>
      <text x="705" y="218" opacity="0">0012
        <animate attributeName="opacity" values="0;1;0" dur="7.2s" repeatCount="indefinite"/>
      </text>
      <text x="705" y="218" opacity="0">0027
        <animate attributeName="opacity" values="0;0;1;0" dur="7.2s" repeatCount="indefinite"/>
      </text>
      <text x="705" y="218" opacity="0">0041
        <animate attributeName="opacity" values="0;0;0;1;0" dur="7.2s" repeatCount="indefinite"/>
      </text>
      <text x="705" y="218" opacity="0">0058
        <animate attributeName="opacity" values="0;0;0;0;1;0" dur="7.2s" repeatCount="indefinite"/>
      </text>
      <text x="705" y="218" opacity="0">0074
        <animate attributeName="opacity" values="0;0;0;0;0;1;0" dur="7.2s" repeatCount="indefinite"/>
      </text>
    </g>

    <text x="705" y="258" fill="#9ca3af" font-size="11" letter-spacing="2">PATTERN</text>
    <text x="705" y="282" fill="#ec4899" font-size="16">RANDOM</text>
  </g>

  <rect x="250" y="316" width="420" height="24" rx="12" fill="#22d3ee" fill-opacity=".06" stroke="#22d3ee" stroke-opacity=".25"/>
  <text x="460" y="332" text-anchor="middle" fill="#67e8f9" font-family="monospace" font-size="10" letter-spacing="2">CLICK THE PREVIEW TO TAKE CONTROL</text>

  <text x="42" y="328" fill="#6b7280" font-family="monospace" font-size="10" letter-spacing="1.5">HTML / CSS / JAVASCRIPT • GITHUB PAGES</text>
</svg>
